name: CI/CD Deploy to Aliyun ECS (Nginx)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SERVER_PORT: ${{ secrets.SERVER_PORT }}
  DEPLOY_STAGING: /tmp/nginx-cicd-demo-stage

jobs:
  build:
    name: Build & Lint (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML files exist
        run: |
          test -f public/index.html || (echo "missing index.html" && exit 1)
          echo "HTML validation passed"

      - name: Simple HTML syntax check (tidy)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tidy
          tidy -qe public/index.html || true

      - name: Validate nginx config syntax (docker)
        run: |
          docker run --rm -v "$PWD/nginx:/etc/nginx/conf.d:ro" nginx:alpine nginx -t

  deploy:
    name: Deploy to ECS (CD)
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) 上传静态文件到服务器临时目录
      - name: Upload static files (staging)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "public/*"
          target: "/tmp/nginx-cicd-demo-stage/public"
          strip_components: 1

      # 2) 上传 nginx 站点配置
      - name: Upload nginx site config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "nginx/nginx-cicd-demo.conf"
          target: "/tmp/nginx-cicd-demo-stage"
          strip_components: 1

      # 3) 上传部署脚本
      - name: Upload deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "scripts/deploy.sh"
          target: "/tmp/nginx-cicd-demo-stage"
          strip_components: 1

      # 4) 远程执行部署脚本
      - name: Execute remote deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            chmod +x /tmp/nginx-cicd-demo-stage/deploy.sh
            bash /tmp/nginx-cicd-demo-stage/deploy.sh

      - name: Health check
        run: |
          echo "Waiting for reload..."
          sleep 3
          curl -fsS -o /dev/null -w "%{http_code}\n" "http://${{ secrets.SERVER_HOST }}/"