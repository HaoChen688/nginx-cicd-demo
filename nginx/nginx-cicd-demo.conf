## 四、Nginx 站点配置 `nginx/nginx-cicd-demo.conf`

> 首次部署时会把这个文件放到 `/etc/nginx/conf.d/nginx-cicd-demo.conf`，并 `nginx -t` 校验后 reload。这样比直接改默认 server 更干净。

```nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/nginx-cicd-demo;
    index index.html;

    # 访问日志 & 错误日志
    access_log /var/log/nginx/nginx-cicd-demo.access.log;
    error_log  /var/log/nginx/nginx-cicd-demo.error.log warn;

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # HTML 不缓存，方便验证部署
    location ~* \.html$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA / 静态站点回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}